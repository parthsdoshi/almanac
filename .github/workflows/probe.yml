name: SDK probe
on:
  push:
    branches: [sdk-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dump Xcode 27.2 SDK interfaces
        run: |
          X=/Applications/Xcode_27.2.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          echo "Using $X"; "$X/Contents/Developer/usr/bin/xcodebuild" -version
          P="$X/Contents/Developer/Platforms/iPhoneOS.platform/Developer"
          SDK="$P/SDKs/iPhoneOS.sdk"
          mkdir -p dump
          "$X/Contents/Developer/usr/bin/xcodebuild" -version > dump/VERSION
          ls "$SDK/System/Library/Frameworks" > dump/frameworks.txt
          ls "$P/Library/Frameworks" > dump/devframeworks.txt
          for fw in FoundationModels AppIntents WidgetKit SwiftUI Vision CoreSpotlight; do
            f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
            [ -n "$f" ] && cp "$f" "dump/$fw.swiftinterface"
          done
          for d in "$P/Library/Frameworks"/*.framework "$SDK/System/Library/Frameworks"/*.framework; do
            n=$(basename "$d" .framework)
            case "$n" in *Eval*|*AppIntentsTest*|*Annotation*|*Profile*)
              f=$(find "$d" -name "arm64e-apple-ios.swiftinterface" -o -name "arm64-apple-ios.swiftinterface" | head -1)
              [ -n "$f" ] && cp "$f" "dump/$n.swiftinterface" && echo "copied $n";;
            esac
          done
          ls -la dump
      - name: Push dump to sdk-dump branch
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan sdk-dump
          git rm -rfq --cached . ; git add -f dump
          git commit -qm "SDK interfaces"
          git push -f origin HEAD:sdk-dump
