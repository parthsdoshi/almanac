name: SDK probe
on:
  push:
    branches: [sdk-probe]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: List Xcodes
        run: |
          sw_vers || true
          ls -d /Applications/Xcode*.app || true
      - name: Dump newest SDK interfaces
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v beta | sort -V | tail -1); [ -z "$X" ] && X=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1); xcodebuild -version || true
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $X"
          SDK="$X/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          ls "$X/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/"
          mkdir -p out
          for fw in FoundationModels AppIntents WidgetKit SwiftUI Vision CoreSpotlight; do
            f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name "arm64e-apple-ios.swiftinterface" 2>/dev/null | head -1)
            [ -z "$f" ] && f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name "*.swiftinterface" 2>/dev/null | head -1)
            echo "$fw -> $f"
            [ -n "$f" ] && cp "$f" "out/$fw.swiftinterface"
          done
          ls "$SDK/System/Library/Frameworks" | grep -i -E "eval|intent|model|annot|ai" || true
          for fw in $(ls "$SDK/System/Library/Frameworks" | grep -i -E "Evaluat|Testing" | sed 's/.framework//'); do
            f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name "*.swiftinterface" 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" "out/$fw.swiftinterface"
          done
          find "$X/Contents/Developer/Platforms/iPhoneOS.platform/Developer/Library/Frameworks" -maxdepth 1 2>/dev/null | head -40
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.os }}
          path: out
