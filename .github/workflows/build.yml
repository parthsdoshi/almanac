# Compiles the app, widget and tests on a GitHub Mac runner for every pull
# request and every push to main, unsigned and for the Simulator, so Swift errors show up before
# anyone opens Xcode. Needs no secrets. Free on a public repo.
name: Build

on:
  push:
    branches: [main, widget, feedback, hub, health, jot, icloud, ios27, ios27-icloud, hotfix, workout-live]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27   # GitHub image with the Xcode 27 SDKs (iOS 27)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.1
        run: |
          # 27.1, not 27.2: the 27.2 tools call into parts of iOS that 27.2 betas lack (build 12 crashed on launch).
          X=/Applications/Xcode_27.1.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_27*.app | grep -v -i -E "beta|candidate" | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          ls -la /Applications | grep -i xcode
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and run the tests on a Simulator
        run: |
          # One xcodebuild for the exact Simulator the tests run on. A generic Simulator build
          # first compiled everything twice and held a Mac runner for it.
          # Newest iOS that has a regular iPhone (27.1 on this image only runs the two-screen iPhone Duo).
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; v=lambda k:[int(n) for n in re.findall(r"\d+", k.split("iOS-")[-1])[:2]]; c=[(v(k),x["udid"]) for k in d if "SimRuntime.iOS-" in k for x in d[k] if re.fullmatch(r"iPhone \d+( Pro)?", x["name"])]; c.sort(); print(c[-1][1])')
          echo "Testing on $UDID"
          # Boot the Simulator while the app compiles, instead of after, since booting it is
          # most of the test time on these runners.
          xcrun simctl boot "$UDID" || true
          xcodebuild test \
            -project Occasions.xcodeproj \
            -scheme Occasions \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
