# Compiles the app, widget and tests on a GitHub Mac runner for every pull
# request and every push to main, unsigned and for the Simulator, so Swift errors show up before
# anyone opens Xcode. Needs no secrets. Free on a public repo.
name: Build

on:
  push:
    branches: [main, widget, feedback]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app, widget and tests
        run: |
          xcodebuild build-for-testing \
            -project Occasions.xcodeproj \
            -scheme Occasions \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
