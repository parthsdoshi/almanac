# Compiles the app, widget and tests on a GitHub Mac runner for every pull
# request and every push to main, unsigned and for the Simulator, so Swift errors show up before
# anyone opens Xcode. Needs no secrets. Free on a public repo.
name: Build

on:
  push:
    branches: [main, widget, feedback, hub, health, jot, icloud, ios27, ios27-icloud]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27   # GitHub image with the Xcode 27 SDKs (iOS 27)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.2
        run: |
          X=/Applications/Xcode_27.2.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_27*.app | grep -v -i -E "beta|candidate" | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app, widget and tests
        run: |
          xcodebuild build-for-testing \
            -project Occasions.xcodeproj \
            -scheme Occasions \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run the tests on a Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; rt=sorted((k for k in d if "iOS" in k and any(x["name"].startswith("iPhone") for x in d[k])), key=lambda k: [int(n) for n in re.findall(r"\d+", k.split("iOS-")[-1])[:2]]); print(next(x["udid"] for x in d[rt[-1]] if x["name"].startswith("iPhone")))')
          echo "Testing on $UDID"
          xcodebuild test \
            -project Occasions.xcodeproj \
            -scheme Occasions \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
