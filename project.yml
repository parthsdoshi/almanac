# XcodeGen spec. Run `xcodegen generate` to produce Occasions.xcodeproj.
# The .xcodeproj is generated, so it's gitignored: edit this file instead.
name: Occasions
options:
  deploymentTarget:
    iOS: "17.2"            # push-to-start Live Activities need 17.2+
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Occasions:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/Occasions.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [$(APP_GROUP_ID)]   # shared with the widget
        com.apple.developer.healthkit: true                        # saves finished lifts to Health
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Shebang#!"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIAppFonts:              # Shared/Fonts, bundled into the app and the widget
          - AlmanacDisplay-Black.ttf
          - AlmanacDisplay-Bold.ttf
          - AlmanacDisplay-SemiBoldItalic.ttf
        ITSAppUsesNonExemptEncryption: false   # HTTPS only, so TestFlight skips the export compliance question
        NSContactsUsageDescription: "Shebang#! reads birthdays and anniversaries from your contacts, and saves birthdays you choose to add from your calendar."
        NSRemindersFullAccessUsageDescription: "Shebang#! adds the to-dos you jot to Apple Reminders and shows today's on the Today screen."
        NSCameraUsageDescription: "Shebang#! reads the words on a card or invite you photograph, on your iPhone, to turn them into to-dos."
        NSCalendarsFullAccessUsageDescription: "Shebang#! looks through your calendar for birthday events that aren't in your contacts yet, and shows today's events on the Today screen."
        NSHealthUpdateUsageDescription: "Shebang#! saves your finished lifts and the bodyweight you log to Apple Health."
        NSHealthShareUsageDescription: "Shebang#! doesn't read anything from Apple Health. It only saves your workouts and bodyweight there."
        UIBackgroundModes: [fetch]
        INAlternativeAppNames:       # so "Jot in Shebang" works out loud
          - INAlternativeAppName: Shebang
        BGTaskSchedulerPermittedIdentifiers: [occasions.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: occasions
            CFBundleURLSchemes: [occasions]
        OccasionsServerHost: $(OCCASIONS_SERVER_HOST)
        OccasionsAPIKey: $(OCCASIONS_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_MODULE_NAME: Occasions
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only. Must be per target: XcodeGen's iOS preset sets "1,2" on each target, which beats a project-level value.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # placeholder icon, App/Assets.xcassets
    dependencies:
      - target: OccasionsWidget
    scheme:
      testTargets: [OccasionsTests]
  OccasionsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/OccasionsWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]   # reads the app's widget snapshot
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Shebang#!"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        UIAppFonts:              # Shared/Fonts, bundled into the app and the widget
          - AlmanacDisplay-Black.ttf
          - AlmanacDisplay-Bold.ttf
          - AlmanacDisplay-SemiBoldItalic.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
  OccasionsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Occasions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  # Siri intent tests (AppIntentsTesting). They need an iOS 27.2 Simulator, so
  # they run from siri-tests.yml, not with the regular tests.
  OccasionsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Occasions
    info:
      path: UITests/Info.plist
      properties:
        AppBundleID: $(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
